
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management Application</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Application Header -->
    <header>
        <h1>Student Management Application</h1>
    </header>

    <!-- Main Container -->
    <main>

        <!-- Student Registration Section -->
        <section>

            <h2>Student Registration Form</h2>
            <p id="errorMessage" role="alert"></p>
            <form id="studentForm" novalidate>

                <!-- Student Name -->
                <div>
                    <label for="name">Student Name:</label>

                    <input type="text"
                           id="name"
                           placeholder="Enter student name"
                           required>
                </div>

                <!-- Email -->
                <div>
                    <label for="email">Email:</label>

                    <input type="email"
                           id="email"
                           placeholder="Enter email"
                           required>
                </div>

                <!-- Mobile Number -->
                <div>
                    <label for="mobile">Mobile Number:</label>

                    <input type="tel"
                           id="mobile"
                           placeholder="Enter mobile number"
                           required>
                </div>

                <!-- Course Dropdown -->
                <div>
                    <label for="course">Course:</label>

                    <select id="course" required>

                        <option value="">Select Course</option>

                        <option value="HTML">HTML</option>

                        <option value="CSS">CSS</option>

                        <option value="JavaScript">JavaScript</option>

                        <option value="Python">Python</option>

                        <option value="Django">Django</option>

                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" hidden>Cancel Edit</button>

            </form>

        </section>


        <!-- Student Records Section -->
        <section>

            <h2>Student Records</h2>

            <!-- Search Input -->
            <input type="text"
                   id="searchInput"
                   placeholder="Search student by name"
                   aria-label="Search student by name">


            <!-- Responsive Table Container -->
            <div class="table-container">

                <table id="studentTable">

                    <!-- Table Headers -->
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>


                    <!-- Student Records -->
                    <tbody id="studentList">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>

</html>
